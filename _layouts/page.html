---
layout: default
---

<article class="page">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% comment %} subtitle 是标题下的小字；description 只用于搜索引擎摘要，两者分开 {% endcomment %}
    {% if page.subtitle %}<p class="page-desc">{{ page.subtitle }}</p>{% endif %}
  </header>
  {{ content }}
</article>
